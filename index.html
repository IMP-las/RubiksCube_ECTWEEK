<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ECT Week Picture Cube</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>ECT WEEK</h1>
      <p>Picture Cube Challenge</p>
    </header>

    <main id="stage">
      <div id="scene"></div>
    </main>

    <section class="hud">
      <div class="stat">
        <span class="stat-label">Time</span
        ><strong id="timer" class="stat-value">0:00.0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">Moves</span
        ><strong id="moveCount" class="stat-value">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">Best</span
        ><strong id="bestTime" class="stat-value">--</strong>
      </div>
    </section>
    <p id="status" class="status" role="status"></p>

    <p class="hint">
      Drag a tile to turn a layer · Drag outside to rotate view
    </p>

    <section class="actions">
      <button id="scrambleBtn" class="action">Scramble</button>
      <button id="resetBtn" class="action action-secondary">Reset</button>
    </section>

    <div
      id="winScreen"
      class="win"
      role="dialog"
      aria-modal="true"
      aria-labelledby="winTitle"
      hidden
    >
      <div class="win-card">
        <p id="winBadge" class="win-badge" hidden>New best time!</p>
        <h2 id="winTitle">Solved!</h2>
        <p id="winTime" class="win-time">0:00.00</p>
        <dl class="win-stats">
          <div>
            <dt>Moves</dt>
            <dd id="winMoves">0</dd>
          </div>
          <div>
            <dt>Best</dt>
            <dd id="winBest">--</dd>
          </div>
        </dl>
        <div class="win-actions">
          <button id="playAgainBtn" class="action">Play again</button>
          <button id="closeWinBtn" class="action action-secondary">
            Close
          </button>
        </div>
      </div>
    </div>

    <script src="cube-logic.js"></script>
    <script src="cube-orientation.js"></script>
    <script src="cube-app-bridge.js"></script>
    <script src="cube-storage.js"></script>
    <script src="cube-view.js"></script>
    <script src="cube-feedback.js"></script>
    <script src="cube-input.js"></script>
    <script src="cube-game.js"></script>
    <script src="main.js"></script>
  </body>
</html>
